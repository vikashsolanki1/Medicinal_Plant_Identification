<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Medicinal Plant Classification</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .bg-overlay {
      background: rgba(0, 0, 0, 0.6); /* Black overlay with transparency */
    }
  </style>
</head>
<body class="bg-gray-900 text-white">

  <!-- Navbar -->
  <header class="bg-black py-4 shadow-lg bg-opacity-70">
    <div class="container mx-auto flex justify-between items-center px-6">
      <h1 class="text-xl font-bold text-blue-400">Medicinal Plant Classification</h1>
      <nav>
        <ul class="flex space-x-6">
          <li><a href="#" class="hover:text-blue-400">Home</a></li>
          <li><a href="#" class="hover:text-blue-400">About Us</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="relative h-screen">
   
    <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('static/firstpic.jpeg');">
    </div>

   
    <div class="absolute inset-0 bg-overlay"></div>

    
    <div class="relative z-10 flex items-center justify-center h-full text-center">
      <div>
        <h1 class="text-4xl font-bold text-white mb-4">
          Medicinal Plant Identification Using Machine Learning Techniques
        </h1>
        <p class="text-lg text-gray-300">
          Discover the power of AI for identifying medicinal plants with precision.
        </p>
      </div>
    </div>
  </section>

  
  <section class="bg-gray-800 py-10 px-6">
    <div class="max-w-2xl mx-auto text-center bg-gray-900 rounded-lg shadow-lg p-8">
      <h2 class="text-2xl font-semibold text-white mb-4">Medicinal Plant Classifier</h2>
      
      <!-- Upload Form -->
      <form action="/predict" method="POST" enctype="multipart/form-data">
        <label class="block text-sm font-medium text-gray-300 mb-2">Upload a Plant Image:</label>
        <input 
          type="file" 
          name="file" 
          accept="image/*" 
          class="block w-full text-sm text-gray-500 bg-gray-700 rounded border border-gray-600 cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-400"
          required>
        <p class="mt-2 text-gray-400 text-sm">Supported formats: JPG, PNG.</p>
        <button 
          type="submit" 
          class="mt-4 bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">
          Upload & Classify
        </button>
      </form>
    </div>
  </section>

</body>
</html>
